<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#3f3f46" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Credit Card Graphic -->
  <g transform="translate(66, 120)">
    <!-- Main Card Body -->
    <rect width="380" height="236" rx="28" fill="url(#cardGrad)" stroke="#52525b" stroke-width="3"/>
    
    <!-- Magnetic Strip Accent -->
    <rect x="0" y="44" width="380" height="36" fill="#09090b"/>
    
    <!-- Chip -->
    <rect x="36" y="104" width="54" height="42" rx="8" fill="url(#goldGrad)"/>
    <line x1="36" y1="125" x2="90" y2="125" stroke="#78350f" stroke-width="2"/>
    <line x1="63" y1="104" x2="63" y2="146" stroke="#78350f" stroke-width="2"/>

    <!-- Contactless Wave -->
    <path d="M110 112 A 18 18 0 0 1 110 138" fill="none" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round"/>
    <path d="M118 106 A 26 26 0 0 1 118 144" fill="none" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round"/>

    <!-- Rupee Sign / Balance Emblem -->
    <g transform="translate(260, 115)">
      <circle cx="48" cy="48" r="44" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="3"/>
      <text x="48" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="bold" fill="#10b981" text-anchor="middle">₹</text>
    </g>

    <!-- Cardholder lines placeholder -->
    <rect x="36" y="184" width="130" height="12" rx="4" fill="#71717a"/>
    <rect x="36" y="202" width="70" height="8" rx="3" fill="#52525b"/>
  </g>

  <!-- EMI Brand Label at Bottom -->
  <text x="256" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#f4f4f5" letter-spacing="4" text-anchor="middle">EMI TRACKER</text>
</svg>
